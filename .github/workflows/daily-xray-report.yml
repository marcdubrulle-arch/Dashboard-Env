name: Daily XRAY Report

on:
  schedule:
    # 06:30 UTC ~= 08:30 Europe/Paris (ajuster selon besoin)
    - cron: '30 6 * * 1-5'
  workflow_dispatch:
    inputs:
      start_date:
        description: "Date de début (YYYY-MM-DD). Optionnel."
        required: false
        type: string
      end_date:
        description: "Date de fin (YYYY-MM-DD). Optionnel, utilisé avec start_date."
        required: false
        type: string
      verify_confluence:
        description: "Échoue si la publication Confluence n'est pas confirmée."
        required: false
        default: false
        type: boolean
      publish_confluence:
        description: "Publie aussi sur Confluence pendant un backfill."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate reports (XITG + XMQ1)
        run: |
          set -euo pipefail

          STRICT_FLAG="--ignore-confluence-errors"
          if [ "${{ github.event.inputs.verify_confluence || 'false' }}" = "true" ]; then
            STRICT_FLAG=""
          fi

          PUBLISH_CONFLUENCE="true"
          START_DATE="${{ github.event.inputs.start_date || '' }}"
          END_DATE="${{ github.event.inputs.end_date || '' }}"
          if [ -n "$START_DATE" ]; then
            PUBLISH_CONFLUENCE="${{ github.event.inputs.publish_confluence || 'false' }}"
          fi
          if [ "${{ github.event.inputs.verify_confluence || 'false' }}" = "true" ]; then
            PUBLISH_CONFLUENCE="true"
          fi

          run_one() {
            local day="$1"
            local env_name="$2"
            local title="Rapport XRAY - ${env_name}"
            local output_file="rapport_${env_name}_${day}.html"
            local cmd=(
              python xray_rapport_du_jour.py
              --date "$day"
              --env "$env_name"
              --output "$output_file"
            )
            if [ "$PUBLISH_CONFLUENCE" = "true" ]; then
              cmd+=(
                --confluence
                --confluence-page-title "$title"
                --confluence-parent-id 468779106
              )
            fi
            if [ -n "$STRICT_FLAG" ]; then
              cmd+=("$STRICT_FLAG")
            fi

            if [ "${{ github.event.inputs.verify_confluence || 'false' }}" = "true" ]; then
              out="$("${cmd[@]}")"
              echo "$out"
              echo "$out" | grep -q "\[CONFLUENCE_URL\]" || {
                echo "Publication Confluence non confirmée pour ${env_name} (${day})."
                exit 1
              }
            else
              "${cmd[@]}"
            fi
          }

          if [ -n "$START_DATE" ]; then
            if [ -z "$END_DATE" ]; then
              END_DATE="$START_DATE"
            fi
            CUR="$START_DATE"
            while [ "$(date -d "$CUR" +%s)" -le "$(date -d "$END_DATE" +%s)" ]; do
              DOW="$(date -d "$CUR" +%u)"
              if [ "$DOW" -le 5 ]; then
                run_one "$CUR" "XITG"
                run_one "$CUR" "XMQ1"
              fi
              CUR="$(date -I -d "$CUR + 1 day")"
            done
          else
            YESTERDAY="$(date -d 'yesterday' +%F)"
            run_one "$YESTERDAY" "XITG"
            run_one "$YESTERDAY" "XMQ1"
          fi

          python generate_accueil.py --output accueil.html

      - name: Prepare GitHub Pages content
        run: |
          cp accueil.html index.html

      - name: Upload generated HTML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xray-rapport-html
          path: |
            rapport_*.html
            accueil.html

      - name: Upload stats history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-stats-history
          path: stats_history.json
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-pages:
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
    needs: build-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
