name: Daily XRAY Report

on:
  schedule:
    # 06:30 UTC ~= 08:30 Europe/Paris (ajuster selon besoin)
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate reports (XITG + XMQ1)
        run: |
          python xray_rapport_du_jour.py --env XITG --output rapport_XITG_$(date +%F).html --confluence --confluence-page-title "Rapport XRAY - XITG" --confluence-parent-id 468779106
          python xray_rapport_du_jour.py --env XMQ1 --output rapport_XMQ1_$(date +%F).html --confluence --confluence-page-title "Rapport XRAY - XMQ1" --confluence-parent-id 468779106
          python generate_accueil.py --output accueil.html

      - name: Prepare GitHub Pages content
        run: |
          cp accueil.html index.html

      - name: Upload generated HTML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xray-rapport-html
          path: |
            rapport_*.html
            accueil.html

      - name: Upload stats history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-stats-history
          path: stats_history.json
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-pages:
    needs: build-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
